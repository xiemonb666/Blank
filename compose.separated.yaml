name: blank-learning-separated

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: blank-separated-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blank
      POSTGRES_PASSWORD: ${BLANK_POSTGRES_PASSWORD:-blank}
      POSTGRES_DB: blank
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - blank-separated-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blank -d blank"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - blank-separated

  redis:
    image: redis:7-alpine
    container_name: blank-separated-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - blank-separated-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - blank-separated

  neo4j:
    image: neo4j:5.26-community
    container_name: blank-separated-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${BLANK_NEO4J_AUTH:-neo4j/change-this-password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - blank-separated-neo4j-data:/data
      - blank-separated-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - blank-separated

  backend:
    image: blank-learning/backend:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: blank-separated-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "${BLANK_BACKEND_BIND:-127.0.0.1}:8000:8000"
    environment:
      BLANK_ENV: ${BLANK_ENV:-development}
      BLANK_SECRET_KEY: ${BLANK_SECRET_KEY:-change-this-to-at-least-32-random-characters}
      BLANK_ADMIN_BOOTSTRAP_KEY: ${BLANK_ADMIN_BOOTSTRAP_KEY:-change-this-before-first-admin}
      BLANK_ALLOWED_HOSTS: ${BLANK_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      BLANK_CORS_ORIGINS: ${BLANK_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      BLANK_DATABASE_URL: ${BLANK_DATABASE_URL:-postgresql://blank:${BLANK_POSTGRES_PASSWORD:-blank}@postgres:5432/blank}
      BLANK_REDIS_URL: ${BLANK_REDIS_URL:-redis://redis:6379/0}
      BLANK_NEO4J_URI: ${BLANK_NEO4J_URI:-bolt://neo4j:7687}
      BLANK_NEO4J_USER: ${BLANK_NEO4J_USER:-neo4j}
      BLANK_NEO4J_PASSWORD: ${BLANK_NEO4J_PASSWORD:-change-this-password}
      BLANK_GRAPHRAG_ENABLED: ${BLANK_GRAPHRAG_ENABLED:-true}
      BLANK_RAG_BACKEND: ${BLANK_RAG_BACKEND:-sag}
      BLANK_DB_POOL_MIN_CONN: ${BLANK_DB_POOL_MIN_CONN:-1}
      BLANK_DB_POOL_MAX_CONN: ${BLANK_DB_POOL_MAX_CONN:-20}
      BLANK_OCR_ENABLED: ${BLANK_OCR_ENABLED:-false}
      BLANK_UNLIMITED_OCR_BASE_URL: ${BLANK_UNLIMITED_OCR_BASE_URL:-}
      BLANK_UNLIMITED_OCR_PATH: ${BLANK_UNLIMITED_OCR_PATH:-/ocr}
      BLANK_MAX_REQUEST_BYTES: ${BLANK_MAX_REQUEST_BYTES:-1048576}
      BLANK_ALLOW_PRIVATE_MODEL_URLS: ${BLANK_ALLOW_PRIVATE_MODEL_URLS:-false}
      BLANK_ALLOW_PUBLIC_REGISTRATION: ${BLANK_ALLOW_PUBLIC_REGISTRATION:-false}
      BLANK_TRUST_PROXY_HEADERS: ${BLANK_TRUST_PROXY_HEADERS:-false}
      BLANK_DEBUG_LOG_ENABLED: ${BLANK_DEBUG_LOG_ENABLED:-true}
      BLANK_DEBUG_LOG_PATH: ${BLANK_DEBUG_LOG_PATH:-/app/backend/data/debug.log}
    volumes:
      - blank-separated-backend-data:/app/backend/data
    networks:
      - blank-separated

  frontend:
    image: blank-learning/frontend:local
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: blank-separated-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${BLANK_FRONTEND_BIND:-127.0.0.1}:8080:80"
    networks:
      - blank-separated

volumes:
  blank-separated-postgres-data:
  blank-separated-redis-data:
  blank-separated-neo4j-data:
  blank-separated-neo4j-logs:
  blank-separated-backend-data:

networks:
  blank-separated:
    driver: bridge
